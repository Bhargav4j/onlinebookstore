=== docker-compose.yml ===
version: '3.8'

services:
  onlinebookstore-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: onlinebookstore:latest
    container_name: onlinebookstore-app
    ports:
      - "8080:8080"
    environment:
      - JAVA_OPTS=-Xmx512m -Xms256m -XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0
      - TZ=UTC
      - DB_HOST=${DB_HOST:-host.docker.internal}
      - DB_PORT=${DB_PORT:-3306}
      - DB_NAME=${DB_NAME:-onlinebookstore}
      - DB_USER_NAME=${DB_USER_NAME:-root}
      - DB_PASSWORD=${DB_PASSWORD:-root}
    volumes:
      - ./logs:/app/logs
    networks:
      - app-network
    restart: unless-stopped

networks:
  app-network:
    driver: bridge
